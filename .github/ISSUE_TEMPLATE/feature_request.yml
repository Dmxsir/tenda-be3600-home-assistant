name: Feature request
description: Suggest a local, read-only improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Requests that write router settings, reboot devices, or block clients are outside this project's scope.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed read-only behavior
    validations:
      required: true
  - type: input
    id: device_firmware
    attributes:
      label: Router model and firmware
      placeholder: Tenda ME3 Pro BE3600, V16.03.60.62_multi
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request preserves local, read-only operation.
          required: true
        - label: I have not included captures, credentials, tokens, or real network identifiers.
          required: true
